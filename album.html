
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Memories | Photo Album</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f8f3ed;
            color: #59483e;
            font-family: Georgia, 'Times New Roman', serif;
            min-height: 100vh;
        }

        /* HEADER */

        .header {
            text-align: center;
            padding: 65px 20px 35px;
        }

        .back-link {
            display: inline-block;
            color: #967567;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 35px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #59483e;
        }

        .header h1 {
            font-size: clamp(32px, 5vw, 48px);
            font-weight: normal;
            font-style: italic;
            margin-bottom: 15px;
        }

        .header p {
            color: #967567;
            font-size: 15px;
            line-height: 1.8;
        }

        .header-divider {
            width: 65px;
            height: 1px;
            background: #c7a995;
            margin: 30px auto 0;
        }

        /* MAIN CONTAINER */

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 25px 80px;
        }

        .gallery-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            color: #967567;
            font-size: 13px;
        }

        /* GALLERY */

        .gallery {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(230px, 1fr));
            gap: 28px;
        }

        .media-item {
            position: relative;
            background: #fffdf9;
            padding: 12px 12px 18px;
            box-shadow: 0 5px 18px rgba(80, 55, 40, 0.09);
            cursor: pointer;
            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;
            animation: fadeIn 0.5s ease;
        }

        .media-item:hover {
            transform: translateY(-6px) rotate(-1deg);
            box-shadow: 0 12px 25px rgba(80, 55, 40, 0.15);
        }

        .media-preview {
            width: 100%;
            aspect-ratio: 4 / 5;
            overflow: hidden;
            background: #eee5dc;
            position: relative;
        }

        .media-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .media-item:hover .media-preview img {
            transform: scale(1.04);
        }

        .media-name {
            font-size: 12px;
            color: #967567;
            text-align: center;
            margin-top: 15px;
            overflow-wrap: anywhere;
        }

        /* VIDEO PLAY ICON */

        .video-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.88);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #765c4d;
            font-size: 20px;
            padding-left: 4px;
            box-shadow: 0 3px 12px #00000020;
        }

        /* LOADING */

        .status {
            text-align: center;
            padding: 60px 20px;
            color: #967567;
            line-height: 1.8;
        }

        .spinner {
            width: 35px;
            height: 35px;
            border: 3px solid #e6d9cf;
            border-top-color: #967567;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(25, 20, 17, 0.95);
            justify-content: center;
            align-items: center;
            padding: 55px 20px 25px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            max-width: 95%;
            max-height: 90%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
        }

        .modal-content iframe {
            width: min(1000px, 85vw);
            aspect-ratio: 16 / 9;
            border: none;
            background: black;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 28px;
            color: white;
            font-size: 42px;
            font-weight: normal;
            cursor: pointer;
            line-height: 1;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: #d8bba6;
        }

        .modal-caption {
            position: absolute;
            bottom: 15px;
            left: 20px;
            right: 20px;
            text-align: center;
            color: #e8dcd2;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        /* FOOTER */

        .footer {
            text-align: center;
            padding: 35px 20px;
            color: #b29a8a;
            font-size: 13px;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .header {
                padding-top: 40px;
            }

            .container {
                padding: 15px 15px 60px;
            }

            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 15px;
            }

            .media-item {
                padding: 8px 8px 13px;
            }

            .media-preview {
                aspect-ratio: 3 / 4;
            }

            .modal-content iframe {
                width: 90vw;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <a href="index.html" class="back-link">
            ← Back to our memories
        </a>

        <h1>Our Little Memories</h1>

        <p>
            Every picture holds a story.<br>
            Every moment is worth remembering.
        </p>

        <div class="header-divider"></div>

    </header>


    <!-- GALLERY -->

    <main class="container">

        <div class="gallery-info">
            <span>Our photo album</span>
            <span id="media-count">Loading...</span>
        </div>

        <div id="status" class="status">
            <div class="spinner"></div>
            Loading our memories...
        </div>

        <div id="gallery" class="gallery"></div>

    </main>


    <!-- MODAL -->

    <div id="mediaModal" class="modal">

        <span class="modal-close" id="closeModal">
            &times;
        </span>

        <div class="modal-content" id="modalContent"></div>

        <div class="modal-caption" id="modalCaption"></div>

    </div>


    <!-- FOOTER -->

    <footer class="footer">
        Made with love, for all the memories we shared.
    </footer>


    <script>

        // =====================================
        // GOOGLE DRIVE CONFIGURATION
        // =====================================

        const API_KEY = "AIzaSyDTCBxFL0_A2rZMHsPZe3A-Lo5ZbpTHpeE";

        const FOLDER_ID = "1-M0TJsbMdUPCYTa4Y4_M2IfGJJkCq4Z8";


        // =====================================
        // GET ALL IMAGES AND VIDEOS
        // =====================================

        async function getAllMedia() {

            let media = [];
            let pageToken = "";

            do {

                const params = new URLSearchParams({

                    q:
                        `'${FOLDER_ID}' in parents ` +
                        `and trashed = false ` +
                        `and (mimeType contains 'image/' ` +
                        `or mimeType contains 'video/')`,

                    fields:
                        "nextPageToken,files(id,name,mimeType,thumbnailLink,webViewLink,createdTime)",

                    pageSize: "1000",

                    orderBy: "name",

                    key: API_KEY

                });

                if (pageToken) {
                    params.set("pageToken", pageToken);
                }

                const response = await fetch(
                    `https://www.googleapis.com/drive/v3/files?${params}`
                );

                if (!response.ok) {

                    const error = await response.json();

                    throw new Error(
                        error.error?.message ||
                        "Google Drive API error"
                    );

                }

                const data = await response.json();

                media.push(...(data.files || []));

                pageToken = data.nextPageToken || "";

            } while (pageToken);

            return media;

        }


        // =====================================
        // DISPLAY MEDIA
        // =====================================

        async function displayMedia() {

            const gallery = document.getElementById("gallery");

            const status = document.getElementById("status");

            const mediaCount = document.getElementById("media-count");

            try {

                const media = await getAllMedia();

                // Sort by creation time
                media.sort((a, b) =>
                    new Date(b.createdTime) - new Date(a.createdTime)
                );

                status.style.display = "none";

                mediaCount.textContent =
                    `${media.length} memories`;

                if (media.length === 0) {

                    status.style.display = "block";

                    status.textContent =
                        "No photos or videos found in this album.";

                    return;

                }

                media.forEach(file => {

                    const item = document.createElement("div");

                    item.className = "media-item";

                    const preview = document.createElement("div");

                    preview.className = "media-preview";

                    const img = document.createElement("img");

                    // Google Drive thumbnail
                    img.src =
                        `https://drive.google.com/thumbnail?id=${encodeURIComponent(file.id)}&sz=w1000`;

                    img.alt = file.name;

                    img.loading = "lazy";

                    img.onerror = () => {
                        img.style.display = "none";
                        preview.style.background = "#e9ddd3";
                    };

                    preview.appendChild(img);

                    // Video icon
                    if (file.mimeType.startsWith("video/")) {

                        const play = document.createElement("div");

                        play.className = "video-play";

                        play.textContent = "▶";

                        preview.appendChild(play);

                    }

                    const name = document.createElement("div");

                    name.className = "media-name";

                    name.textContent = file.name;

                    item.appendChild(preview);

                    item.appendChild(name);

                    item.addEventListener("click", () => {

                        openMediaModal(file);

                    });

                    gallery.appendChild(item);

                });

            } catch (error) {

                console.error(error);

                status.style.display = "block";

                status.innerHTML = `
                    <p>Unable to load our memories.</p>
                    <p style="font-size:12px; margin-top:10px;">
                        ${escapeHTML(error.message)}
                    </p>
                `;

                mediaCount.textContent = "Error";

            }

        }


        // =====================================
        // OPEN MODAL
        // =====================================

        function openMediaModal(file) {

            const modal =
                document.getElementById("mediaModal");

            const content =
                document.getElementById("modalContent");

            const caption =
                document.getElementById("modalCaption");

            content.replaceChildren();

            caption.textContent = file.name;

            if (file.mimeType.startsWith("image/")) {

                const img = document.createElement("img");

                img.src =
                    `https://drive.google.com/thumbnail?id=${encodeURIComponent(file.id)}&sz=w2000`;

                img.alt = file.name;

                content.appendChild(img);

            } else if (file.mimeType.startsWith("video/")) {

                const iframe = document.createElement("iframe");

                iframe.src =
                    `https://drive.google.com/file/d/${encodeURIComponent(file.id)}/preview`;

                iframe.allow =
                    "autoplay; fullscreen; picture-in-picture";

                iframe.allowFullscreen = true;

                content.appendChild(iframe);

            }

            modal.classList.add("active");

            document.body.style.overflow = "hidden";

        }


        // =====================================
        // CLOSE MODAL
        // =====================================

        function closeMediaModal() {

            const modal =
                document.getElementById("mediaModal");

            const content =
                document.getElementById("modalContent");

            modal.classList.remove("active");

            // Stop video playback when closing
            content.replaceChildren();

            document.body.style.overflow = "";

        }


        document.getElementById("closeModal")
            .addEventListener("click", closeMediaModal);


        document.getElementById("mediaModal")
            .addEventListener("click", function(event) {

                if (event.target === this) {
                    closeMediaModal();
                }

            });


        // Close with ESC
        document.addEventListener("keydown", event => {

            if (event.key === "Escape") {
                closeMediaModal();
            }

        });


        // =====================================
        // HTML ESCAPE
        // =====================================

        function escapeHTML(value) {

            return String(value).replace(/[&<>"']/g, char => ({

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"

            })[char]);

        }


        // =====================================
        // START
        // =====================================

        displayMedia();

    </script>

</body>
</html>
